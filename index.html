<head>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;color:#202124;background:#f6f7f9}
header{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 18px;gap:16px}
header h1{font-size:19px;margin:0;white-space:nowrap}
header small{color:#777}
.app{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 64px)}
.sidebar{background:#fff;border-right:1px solid #ddd;overflow:auto;padding:14px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
select,input{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;background:#fff}
.filter-wide{grid-column:1/-1}
.count{font-size:13px;color:#666;margin:8px 2px}
.event{padding:12px;border:1px solid #e2e2e2;border-radius:10px;margin:8px 0;cursor:pointer;background:#fff}
.event:hover{background:#f8fbff}
.event .title{font-weight:700;font-size:14px;line-height:1.4}
.event .meta{font-size:12px;color:#666;margin-top:5px}
.event-link{display:inline-block;margin:7px 0 0 8px;font-size:11px;color:#1769aa;text-decoration:none}.event-link:hover{text-decoration:underline}
.badge{display:inline-block;font-size:11px;padding:3px 7px;border-radius:999px;background:#eef2ff;margin-top:7px}
.badge.free{background:#e9f7ef;color:#16794c}
#map{height:100%;min-height:500px}
.detail{position:absolute;right:18px;top:82px;width:330px;max-width:calc(100vw - 40px);background:#fff;border-radius:12px;box-shadow:0 4px 20px #0002;padding:15px;z-index:500;display:none}
.detail h2{font-size:17px;margin:0 0 8px}
.detail p{font-size:13px;line-height:1.6;margin:6px 0}
.detail button{border:0;background:#eee;border-radius:7px;padding:7px 10px;cursor:pointer}
.detail-link{display:inline-block;background:#eef6ff;border:1px solid #cfe5ff;border-radius:7px;padding:7px 10px;color:#1769aa;text-decoration:none;font-weight:600;font-size:13px}
.source{font-size:11px;color:#777;margin-top:12px;border-top:1px solid #eee;padding-top:10px}
.legend{position:absolute;right:18px;top:18px;left:auto;bottom:auto;background:rgba(255,255,255,.82);padding:8px 10px;border-radius:8px;z-index:500;box-shadow:0 2px 10px #0002;font-size:12px}
@media(max-width:800px){
 .app{grid-template-columns:1fr;grid-template-rows:45% 55%}
 .sidebar{border-right:0;border-bottom:1px solid #ddd}
 #map{min-height:0}
 .detail{top:auto;bottom:18px;right:18px}
 .legend{left:18px}
}
 .popup-address{font-size:11px;color:#666;margin-top:3px;line-height:1.35}
.leaflet-control-layers{font-size:13px}@media(max-width:600px){.leaflet-control-layers{font-size:12px}}
.leaflet-control-layers{
  background:rgba(255,255,255,.78)!important;
  border:1px solid rgba(0,0,0,.12)!important;
  border-radius:7px!important;
  box-shadow:0 1px 4px rgba(0,0,0,.18)!important;
  font-size:11px!important;
  line-height:1.35!important;
}
.leaflet-control-layers-list{margin:2px 4px!important}
.leaflet-control-layers label{margin:1px 0!important;white-space:nowrap!important}
@media(max-width:600px){
  .leaflet-control-layers{font-size:10px!important}
}
</style>

  }

  #list::before{

    font-weight:700;
  }

  #list .event{
    padding:12px;
    border:1px solid #e2e2e2;
    border-radius:10px;
    margin:8px 0;
    cursor:pointer;
    background:#fff;
  }
  #list .event:hover{background:#f8fbff}
  #list .event .title{
    font-weight:700;
    font-size:14px;
    line-height:1.4;
  }
  #list .event .meta{
    font-size:12px;
    color:#666;
    margin-top:5px;
    line-height:1.5;
  }
  #list .badge{
    display:inline-block;
    font-size:11px;
    padding:3px 7px;
    border-radius:999px;
    margin-top:7px;
    margin-right:4px;
  }

  /* 凡例はJSでMAP内部へ移動するため、MAP上に表示 */
  .legend{
    position:absolute;
    left:auto;
    right:12px;
    top:12px;
    bottom:auto;
    z-index:500;
    margin:0;
    width:auto;
    max-width:110px;
    font-size:10px;
    line-height:1.45;
    padding:6px 7px;
    border-radius:7px;
    background:rgba(255,255,255,.78);
    box-shadow:0 2px 7px rgba(0,0,0,.12);
    pointer-events:none;
  }
  .legend::first-line{white-space:nowrap;}

  .detail{
    top:auto;
    bottom:10px;
    right:10px;
    width:calc(100vw - 20px);
    max-height:55vh;
    overflow:auto;
  }
}
 .popup-address{font-size:11px;color:#666;margin-top:3px;line-height:1.35}
</style>

const colors={ "夜イベント":"#f28c28","歴史・文化":"#3578c7","アート":"#8e55c7","ファミリー":"#35a56a","スポーツ":"#d64a4a" };
const map=L.map('map').setView([33.5905,130.3980],13);
const legend=document.querySelector(".legend");
if(legend) document.getElementById("map").appendChild(legend);

const standardMap=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  attribution:'&copy; OpenStreetMap contributors'
});

const aerialMap=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
  maxZoom:19,
  attribution:'Tiles &copy; Esri'
});

standardMap.addTo(map);

L.control.layers({
  '通常地図':standardMap,
  '航空写真':aerialMap
},null,{position:'topright',collapsed:false}).addTo(map);

const markers=new Map();
events.forEach(e=>{
  const marker=L.circleMarker([e.lat,e.lng],{
    radius:9,fillColor:colors[e.cat]||"#555",color:"#fff",weight:2,fillOpacity:.95
  }).addTo(map);
  marker.bindTooltip(e.title,{direction:"top"});
  marker.on("click",()=>showDetail(e));
  markers.set(e.id,marker);
});

function active(e){
  const cat=document.getElementById("category").value;
  const period=document.getElementById("period").value;
  const free=document.getElementById("free").checked;
  if(cat && e.cat!==cat)return false;
  if(free && !e.free)return false;
  if(period){
    const pStart=period+"-01";
    const pEnd=period==="2026-10"?"2026-10-31":period==="2026-11"?"2026-11-30":"2026-12-31";
    if(e.end<pStart || e.start>pEnd)return false;
  }
  return true;
}

function render(){
  const list=document.getElementById("list"); list.innerHTML="";
  const filtered=events.filter(active);
  document.getElementById("count").textContent=`${filtered.length}件のイベント`;
  filtered.forEach(e=>{
    const el=document.createElement("div"); el.className="event";
    el.innerHTML=`<div class="title">${e.title}</div><div class="meta">📅 ${e.date}<br>📍 ${e.venue}</div><span class="badge" style="background:${colors[e.cat]}20;color:${colors[e.cat]}">${e.cat}</span>${e.free?'<span class="badge free">無料</span>':''}<a class="event-link" href="${e.url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">公式情報 ↗</a>`;
    el.onclick=()=>{map.setView([e.lat,e.lng],15);showDetail(e);};
    list.appendChild(el);
  });
  events.forEach(e=>markers.get(e.id).setStyle({opacity:active(e)?1:0,fillOpacity:active(e)?0.95:0}));
}
function showDetail(e){
  const d=document.getElementById("detail"); d.style.display="block";
  d.innerHTML=`<button style="float:right" onclick="document.getElementById('detail').style.display='none'">✕</button>
  <h2>${e.title}</h2>
  <p><b>開催日：</b>${e.date}</p><p><b>会場：</b>${e.venue}</p><p><b>住所：</b>${e.address}</p>
  <p><b>カテゴリ：</b>${e.cat}</p><p><b>料金：</b>${e.fee || (e.free?"無料":"有料（詳細は公式情報を確認）")}</p>
  <p>${e.desc}</p>
  <p><a class="detail-link" href="${e.url}" target="_blank" rel="noopener noreferrer">公式情報を見る ↗</a></p>
  <div class="source">※内容は福岡市政だより 令和8年10月1日号の掲載情報をもとに整理。公式情報へのリンクを設定しています。会場座標は施設・会場の位置を基準に設定しています。</div>`;
}
["category","period","free"].forEach(id=>document.getElementById(id).addEventListener("change",render));
render();
</script>

<div style="font-size:10px;color:#777;text-align:center;padding:8px 12px 16px;">
座標は会場・施設単位で確認。複数会場・広域イベントは代表地点です。
</div>
